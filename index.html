<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قاموس للذكاء الاصطناعي</title>
<meta name="description" content="كيف تتعامل مع الذكاء الاصطناعي باحتراف: 33 خطوة على 7 مراحل.">
<meta property="og:title" content="قاموس للذكاء الاصطناعي">
<meta property="og:description" content="33 خطوة على 7 مراحل — Claude وClaude Code وChatGPT. إعداد: معاذ الجهني">
<meta property="og:image" content="https://muath-j.github.io/ai-glossary/cover.png">
<meta name="twitter:card" content="summary_large_image">
<noscript><meta http-equiv="refresh" content="0;url=ai-glossary.pdf"></noscript>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b6b70}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f2f2f2;--mut:#a0a0a6}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px;box-sizing:border-box}
p{color:var(--mut)}a{color:inherit;font-weight:700}
</style>
</head>
<body>
<main>
<h1>قاموس للذكاء الاصطناعي</h1>
<p>جاري فتح الملف…</p>
<p>ما انفتح؟ <a href="ai-glossary.pdf">اضغط هنا</a></p>
</main>
<script>
(function(){
  var pdf = "ai-glossary.pdf", done = false;
  function go(){ if(done) return; done = true; location.replace(pdf); }
  try {
    var q = "p=" + encodeURIComponent("/ai-glossary/") +
            "&t=" + encodeURIComponent(document.title) +
            "&r=" + encodeURIComponent(document.referrer || "") +
            "&rnd=" + Math.random().toString(36).slice(2);
    var img = new Image();
    img.onload = img.onerror = go;
    img.src = "https://glossary-stats.goatcounter.com/count?" + q;
  } catch (e) { go(); }
  setTimeout(go, 800);
})();
</script>
</body>
</html>
